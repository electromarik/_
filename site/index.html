<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Музыкальный плеер</title>
<meta name="description" content="Веб-плеер: плейлист, play/pause, перемотка, громкость, загрузка своих треков." />
<style>
  :root {
    --bg: #0d0e14;
    --panel: #15171f;
    --panel-2: #1b1e29;
    --text: #eef0f4;
    --text-dim: #8a90a3;
    --accent: #ff4d6d;
    --accent-2: #ffd166;
    --border: #262a38;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(60% 50% at 20% 0%, rgba(255,77,109,0.18), transparent 60%),
      radial-gradient(50% 50% at 100% 20%, rgba(255,209,102,0.10), transparent 60%),
      var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 920px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: 0 40px 100px -40px rgba(0,0,0,0.7);
    display: grid;
    grid-template-columns: 300px 1fr;
    overflow: hidden;
  }
  .side {
    background: var(--panel-2);
    border-right: 1px solid var(--border);
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    min-height: 560px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; margin-bottom: 18px; }
  .brand .dot { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display:flex; align-items:center; justify-content:center; font-size: 13px; }
  .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .add-btn {
    flex: 1; border: 1px dashed var(--border); background: transparent; color: var(--text-dim);
    border-radius: 12px; padding: 10px; font-size: 13px; cursor: pointer; transition: border-color .15s, color .15s;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--text); }

  .playlist { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .track {
    display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; cursor: pointer;
    border: 1px solid transparent; transition: background .15s;
  }
  .track:hover { background: rgba(255,255,255,0.04); }
  .track.active { background: rgba(255,77,109,0.14); border-color: rgba(255,77,109,0.35); }
  .track-art {
    width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .track-meta { flex: 1; min-width: 0; }
  .track-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-dur { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
  .track-eq { display: flex; gap: 2px; align-items: flex-end; height: 14px; width: 14px; flex-shrink: 0; }
  .track-eq span { width: 3px; background: var(--accent); border-radius: 2px; animation: eq 0.9s infinite ease-in-out; }
  .track-eq span:nth-child(2) { animation-delay: .2s; } .track-eq span:nth-child(3) { animation-delay: .4s; }
  @keyframes eq { 0%,100% { height: 3px; } 50% { height: 14px; } }

  .main { padding: 32px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
  .art-wrap {
    width: 240px; height: 240px; border-radius: 22px; margin-top: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; font-size: 72px;
    box-shadow: 0 30px 60px -25px rgba(255,77,109,0.5);
  }
  .now-title { margin-top: 26px; font-size: 22px; font-weight: 800; text-align: center; }
  .now-artist { margin-top: 6px; color: var(--text-dim); font-size: 14px; }

  .progress-wrap { width: 100%; max-width: 420px; margin-top: 28px; }
  .bar {
    position: relative; height: 6px; border-radius: 999px; background: var(--border); cursor: pointer; overflow: hidden;
  }
  .bar-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; }
  .time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-top: 8px; }

  .controls { display: flex; align-items: center; gap: 18px; margin-top: 26px; }
  .ctrl-btn {
    background: transparent; border: none; color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center; width: 42px; height: 42px;
    border-radius: 50%; font-size: 18px; transition: background .15s, color .15s;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.08); }
  .ctrl-btn.toggle { color: var(--text-dim); }
  .ctrl-btn.toggle.on { color: var(--accent); }
  .play-btn {
    width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #1a1a1a;
    font-size: 22px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 14px 30px -10px rgba(255,77,109,0.6);
  }

  .vol-row { display: flex; align-items: center; gap: 10px; margin-top: 26px; width: 100%; max-width: 220px; color: var(--text-dim); }
  input[type="range"] {
    -webkit-appearance: none; flex: 1; height: 5px; border-radius: 999px; background: var(--border); outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer;
  }

  @media (max-width: 680px) {
    .app { grid-template-columns: 1fr; }
    .side { border-right: none; border-bottom: 1px solid var(--border); min-height: 220px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="dot">🎵</span> Плейлист</div>
    <div class="add-row">
      <button class="add-btn" id="addFileBtn">+ Добавить свой трек</button>
    </div>
    <input type="file" id="fileInput" accept="audio/*" multiple style="display:none" />
    <div class="playlist" id="playlist"></div>
  </aside>

  <section class="main">
    <div class="art-wrap" id="artWrap">🎧</div>
    <div class="now-title" id="nowTitle">—</div>
    <div class="now-artist" id="nowArtist">—</div>

    <div class="progress-wrap">
      <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    </div>

    <div class="controls">
      <button class="ctrl-btn toggle" id="shuffleBtn" title="Перемешать">🔀</button>
      <button class="ctrl-btn" id="prevBtn" title="Предыдущий">⏮</button>
      <button class="play-btn" id="playBtn" title="Play/Pause">▶</button>
      <button class="ctrl-btn" id="nextBtn" title="Следующий">⏭</button>
      <button class="ctrl-btn toggle" id="repeatBtn" title="Повтор">🔁</button>
    </div>

    <div class="vol-row">
      <span>🔈</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
    </div>
  </section>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function () {
  "use strict";

  // Демо-треки генерируются на лету через Web Audio API (реальный звук, без внешних mp3-файлов).
  // Чтобы подключить свои треки — замени генератор на src: 'моя-песня.mp3' и используй обычный <audio>.
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let demoBuffersCache = {};

  function buildDemoBuffer(freqs, seconds) {
    const sr = ctx.sampleRate;
    const length = sr * seconds;
    const buffer = ctx.createBuffer(2, length, sr);
    for (let ch = 0; ch < 2; ch++) {
      const data = buffer.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        const t = i / sr;
        let sample = 0;
        freqs.forEach((f, idx) => {
          sample += Math.sin(2 * Math.PI * f * t) * (0.18 / (idx + 1));
        });
        const envelope = Math.min(1, t * 6) * Math.min(1, (seconds - t) * 6);
        data[i] = sample * envelope;
      }
    }
    return buffer;
  }

  const playlist = [
    { title: "Demo Track — Sunrise", artist: "Генератор", emoji: "🌅", kind: "demo", freqs: [261.6, 329.6, 392.0], duration: 20 },
    { title: "Demo Track — Nightdrive", artist: "Генератор", emoji: "🌙", kind: "demo", freqs: [220.0, 277.2, 329.6], duration: 20 },
    { title: "Demo Track — Lofi Loop", artist: "Генератор", emoji: "☕", kind: "demo", freqs: [196.0, 246.9, 293.7], duration: 20 },
  ];

  let currentIndex = 0;
  let isPlaying = false;
  let shuffle = false;
  let repeat = false;

  let sourceNode = null;
  let gainNode = ctx.createGain();
  gainNode.connect(ctx.destination);
  let startedAt = 0;
  let offsetAt = 0;
  let rafId = null;

  const audioEl = document.getElementById("audio");
  const playlistEl = document.getElementById("playlist");
  const playBtn = document.getElementById("playBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const shuffleBtn = document.getElementById("shuffleBtn");
  const repeatBtn = document.getElementById("repeatBtn");
  const bar = document.getElementById("bar");
  const barFill = document.getElementById("barFill");
  const curTimeEl = document.getElementById("curTime");
  const durTimeEl = document.getElementById("durTime");
  const nowTitle = document.getElementById("nowTitle");
  const nowArtist = document.getElementById("nowArtist");
  const artWrap = document.getElementById("artWrap");
  const volume = document.getElementById("volume");
  const addFileBtn = document.getElementById("addFileBtn");
  const fileInput = document.getElementById("fileInput");

  function fmtTime(s) {
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ":" + String(sec).padStart(2, "0");
  }

  function renderPlaylist() {
    playlistEl.innerHTML = "";
    playlist.forEach((track, i) => {
      const el = document.createElement("div");
      el.className = "track" + (i === currentIndex ? " active" : "");
      el.innerHTML =
        '<div class="track-art">' + track.emoji + "</div>" +
        '<div class="track-meta">' +
          '<div class="track-title">' + track.title + "</div>" +
          '<div class="track-artist">' + track.artist + "</div>" +
        "</div>" +
        (i === currentIndex && isPlaying
          ? '<div class="track-eq"><span></span><span></span><span></span></div>'
          : '<div class="track-dur">' + fmtTime(track.duration || 0) + "</div>");
      el.addEventListener("click", () => loadTrack(i, true));
      playlistEl.appendChild(el);
    });
  }

  function stopSource() {
    if (sourceNode) {
      try { sourceNode.stop(); } catch (e) {}
      sourceNode.disconnect();
      sourceNode = null;
    }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  function loadTrack(index, autoplay) {
    stopSource();
    audioEl.pause();
    audioEl.removeAttribute("src");
    currentIndex = (index + playlist.length) % playlist.length;
    const track = playlist[currentIndex];
    nowTitle.textContent = track.title;
    nowArtist.textContent = track.artist;
    artWrap.textContent = track.emoji;
    offsetAt = 0;
    barFill.style.width = "0%";
    curTimeEl.textContent = "0:00";
    durTimeEl.textContent = fmtTime(track.duration || audioEl.duration || 0);
    renderPlaylist();
    if (autoplay) play();
  }

  function getDemoBuffer(track) {
    const key = track.title;
    if (!demoBuffersCache[key]) {
      demoBuffersCache[key] = buildDemoBuffer(track.freqs, track.duration);
    }
    return demoBuffersCache[key];
  }

  function tick() {
    const track = playlist[currentIndex];
    let current, total;
    if (track.kind === "demo") {
      current = ctx.currentTime - startedAt + offsetAt;
      total = track.duration;
      if (current >= total) {
        onTrackEnded();
        return;
      }
    } else {
      current = audioEl.currentTime;
      total = audioEl.duration || track.duration || 0;
    }
    barFill.style.width = Math.min(100, (current / total) * 100) + "%";
    curTimeEl.textContent = fmtTime(current);
    durTimeEl.textContent = fmtTime(total);
    rafId = requestAnimationFrame(tick);
  }

  function onTrackEnded() {
    if (repeat) {
      offsetAt = 0;
      play();
    } else {
      nextTrack();
    }
  }

  function play() {
    const track = playlist[currentIndex];
    if (track.kind === "demo") {
      if (ctx.state === "suspended") ctx.resume();
      stopSource();
      const buffer = getDemoBuffer(track);
      sourceNode = ctx.createBufferSource();
      sourceNode.buffer = buffer;
      sourceNode.connect(gainNode);
      sourceNode.start(0, offsetAt);
      startedAt = ctx.currentTime;
      sourceNode.onended = () => {
        if (isPlaying && ctx.currentTime - startedAt + offsetAt >= track.duration - 0.05) {
          onTrackEnded();
        }
      };
    } else {
      audioEl.play();
    }
    isPlaying = true;
    playBtn.textContent = "⏸";
    renderPlaylist();
    if (rafId) cancelAnimationFrame(rafId);
    tick();
  }

  function pause() {
    const track = playlist[currentIndex];
    if (track.kind === "demo") {
      offsetAt = offsetAt + (ctx.currentTime - startedAt);
      stopSource();
    } else {
      audioEl.pause();
    }
    isPlaying = false;
    playBtn.textContent = "▶";
    renderPlaylist();
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  function togglePlay() {
    isPlaying ? pause() : play();
  }

  function nextTrack() {
    let idx;
    if (shuffle) {
      idx = Math.floor(Math.random() * playlist.length);
    } else {
      idx = currentIndex + 1;
    }
    loadTrack(idx, true);
  }

  function prevTrack() {
    loadTrack(currentIndex - 1, true);
  }

  bar.addEventListener("click", (e) => {
    const rect = bar.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    const track = playlist[currentIndex];
    const total = track.kind === "demo" ? track.duration : (audioEl.duration || track.duration || 0);
    const newTime = ratio * total;
    if (track.kind === "demo") {
      offsetAt = newTime;
      if (isPlaying) play(); else { barFill.style.width = ratio * 100 + "%"; curTimeEl.textContent = fmtTime(newTime); }
    } else {
      audioEl.currentTime = newTime;
    }
  });

  playBtn.addEventListener("click", togglePlay);
  nextBtn.addEventListener("click", nextTrack);
  prevBtn.addEventListener("click", prevTrack);
  shuffleBtn.addEventListener("click", () => { shuffle = !shuffle; shuffleBtn.classList.toggle("on", shuffle); });
  repeatBtn.addEventListener("click", () => { repeat = !repeat; repeatBtn.classList.toggle("on", repeat); });
  volume.addEventListener("input", () => {
    gainNode.gain.value = parseFloat(volume.value);
    audioEl.volume = parseFloat(volume.value);
  });
  gainNode.gain.value = parseFloat(volume.value);
  audioEl.volume = parseFloat(volume.value);

  audioEl.addEventListener("loadedmetadata", () => {
    durTimeEl.textContent = fmtTime(audioEl.duration);
  });
  audioEl.addEventListener("timeupdate", () => {
    const track = playlist[currentIndex];
    if (track.kind !== "demo") {
      const total = audioEl.duration || 0;
      barFill.style.width = total ? (audioEl.currentTime / total) * 100 + "%" : "0%";
      curTimeEl.textContent = fmtTime(audioEl.currentTime);
    }
  });
  audioEl.addEventListener("ended", onTrackEnded);

  addFileBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (e) => {
    const files = Array.from(e.target.files || []);
    files.forEach((file) => {
      const url = URL.createObjectURL(file);
      playlist.push({
        title: file.name.replace(/\.[^.]+$/, ""),
        artist: "Загруженный файл",
        emoji: "🎶",
        kind: "file",
        src: url,
      });
    });
    renderPlaylist();
  });

  // Переопределяем loadTrack для файлов пользователя (src вместо генератора).
  const originalLoadTrack = loadTrack;
  function loadTrackPatched(index, autoplay) {
    const idx = (index + playlist.length) % playlist.length;
    const track = playlist[idx];
    if (track.kind === "file") {
      stopSource();
      currentIndex = idx;
      nowTitle.textContent = track.title;
      nowArtist.textContent = track.artist;
      artWrap.textContent = track.emoji;
      audioEl.src = track.src;
      offsetAt = 0;
      barFill.style.width = "0%";
      curTimeEl.textContent = "0:00";
      renderPlaylist();
      if (autoplay) {
        audioEl.play();
        isPlaying = true;
        playBtn.textContent = "⏸";
        renderPlaylist();
      }
    } else {
      originalLoadTrack(index, autoplay);
    }
  }
  loadTrack = loadTrackPatched;

  renderPlaylist();
  loadTrack(0, false);
})();
</script>

</body>
</html>
